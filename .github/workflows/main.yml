name: TDS Queue Tracker

on:
  schedule:
    # 这里的 cron 是 UTC 时间。东九区 0 点到 13 点，相当于东京时间早上 9 点到晚上 10 点。
    # 每小时的 0 分执行一次
    - cron: '0 0-14 * * *'
  workflow_dispatch: # 允许在网页上随时手动点击运行测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Python script
      run: python tds_crawler.py

    - name: Commit and push if changed
      run: |
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add tds_history.json
        # 如果文件有变动就提交，没有变动就跳过
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update TDS queue data"
        git push
