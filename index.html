<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东京迪士尼海洋 - 历史排队追踪</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #005f9e; }
        .controls { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; background: #e6f2ff; padding: 20px; border-radius: 8px; }
        .control-group { display: flex; flex-direction: column; gap: 10px; }
        select, input[type="range"] { padding: 10px; font-size: 16px; width: 100%; box-sizing: border-box; }
        .time-display { text-align: center; font-size: 24px; font-weight: bold; color: #005f9e; margin-top: 10px; }
        
        .ride-list { list-style: none; padding: 0; display: grid; gap: 15px; }
        .ride-card { display: flex; justify-content: space-between; align-items: center; background: #fafafa; border: 1px solid #eee; padding: 15px; border-radius: 8px; transition: transform 0.2s; }
        .ride-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        
        .ride-info { flex-grow: 1; }
        .ride-name { font-size: 18px; font-weight: bold; margin: 0 0 5px 0; }
        .ride-name-en { font-size: 12px; color: #888; margin: 0; }
        
        .status-group { display: flex; gap: 15px; align-items: center; }
        .wait-time { font-size: 20px; font-weight: bold; color: #d93025; }
        
        .dpa-badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .dpa-available { background: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .dpa-soldout { background: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏰 东京迪士尼海洋 排队追踪室</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="dateSelect"><strong>📅 选择日期：</strong></label>
            <select id="dateSelect"></select>
        </div>
        
        <div class="control-group">
            <label for="timeSlider"><strong>🕒 拖动查看每小时情况 (9:00 - 21:00)：</strong></label>
            <input type="range" id="timeSlider" min="9" max="21" step="1" value="12">
            <div class="time-display" id="timeDisplay">12:00</div>
        </div>
    </div>

    <ul class="ride-list" id="rideList">
        </ul>
</div>

<script>
    let dbData = {};

    // 页面加载时获取 JSON 数据
    // 注意：由于浏览器的跨域安全策略(CORS)，直接双击打开本地 HTML 去读取本地 JSON 可能会报错。
    // 建议使用 VS Code 的 Live Server 插件，或者用 Python 启动一个简单服务: python -m http.server 8000
    fetch('tds_history.json')
        .then(response => response.json())
        .then(data => {
            dbData = data;
            initUI();
        })
        .catch(error => {
            console.error('加载数据失败:', error);
            document.getElementById('rideList').innerHTML = '<p style="color:red; text-align:center;">无法读取数据文件。请确保使用本地服务器(如 Live Server)运行此文件，且 tds_history.json 存在。</p>';
        });

    function initUI() {
        const dateSelect = document.getElementById('dateSelect');
        const timeSlider = document.getElementById('timeSlider');
        
        // 填充日期下拉菜单
        const dates = Object.keys(dbData).sort(); // 按日期排序
        dates.forEach(date => {
            const option = document.createElement('option');
            option.value = date;
            option.textContent = date;
            dateSelect.appendChild(option);
        });

        // 默认选中最后一天
        if (dates.length > 0) {
            dateSelect.value = dates[dates.length - 1];
        }

        // 绑定事件监听器
        dateSelect.addEventListener('change', renderRides);
        timeSlider.addEventListener('input', (e) => {
            // 格式化小时，如 "9" 变成 "09:00"
            const hour = parseInt(e.target.value);
            const formattedTime = hour.toString().padStart(2, '0') + ":00";
            document.getElementById('timeDisplay').textContent = formattedTime;
            renderRides();
        });

        // 初始渲染
        renderRides();
    }

    function renderRides() {
        const date = document.getElementById('dateSelect').value;
        const timeDisplay = document.getElementById('timeDisplay').textContent;
        const listContainer = document.getElementById('rideList');
        
        listContainer.innerHTML = ''; // 清空当前列表

        if (!dbData[date] || !dbData[date][timeDisplay]) {
            listContainer.innerHTML = '<p style="text-align:center; color:#666;">该时段暂无数据</p>';
            return;
        }

        const rides = dbData[date][timeDisplay];

        rides.forEach(ride => {
            const li = document.createElement('li');
            li.className = 'ride-card';
            
            const dpaClass = ride.dpa_sold_out ? 'dpa-soldout' : 'dpa-available';
            const dpaText = ride.dpa_sold_out ? 'DPA 已售罄' : 'DPA 有票';

            li.innerHTML = `
                <div class="ride-info">
                    <h3 class="ride-name">${ride.name_cn}</h3>
                    <p class="ride-name-en">${ride.name_en}</p>
                </div>
                <div class="status-group">
                    <span class="dpa-badge ${dpaClass}">${dpaText}</span>
                    <span class="wait-time">${ride.wait_time} min</span>
                </div>
            `;
            listContainer.appendChild(li);
        });
    }
</script>
</body>
</html>
